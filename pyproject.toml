# Socle Mathilde-Team : le seuil de couverture est déclaré ici et nulle part
# ailleurs (SOCLE.md §4). Versions des outils figées (groupe dev).
[project]
name = "elastiflow-validation"
version = "0.1.0"
description = "Contre-expertise d'ElastiFlow par injection de trafic iperf2 et lecture sFlow"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    # Journalisation (SOCLE §8) : loguru pour tout le Python de l'équipe.
    "loguru==0.7.3",
    "pyyaml==6.0.3",
]

[project.scripts]
efv = "elastiflow_validation.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.coverage.run]
# Couverture des branches obligatoire (SOCLE.md §4).
branch = true
source = ["src/elastiflow_validation", "scripts"]

[tool.coverage.report]
# Seuil bloquant de l'équipe (décision du 21/10/2026, Mathilde-Team/.github#9).
fail_under = 95
show_missing = true
skip_covered = false
